name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 拉全量历史（含 tags）：tag-bumped.mjs 需要判断 tag 是否已存在，默认 fetch-depth: 1 不含 tags 会导致重复打 tag
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create version PR or tag & release
        # 行为说明（changesets/action）：
        # - main 上有未消费的 changeset → 自动创建/更新「chore: version packages」PR（跑 changeset version）
        # - 该 PR 被合并后 → 执行 publish-script（只打 tag、不发 npm），并推送 tag、按各包 CHANGELOG 内容创建 GitHub Release
        uses: changesets/action@v2.1.1
        # 注意：publish-script 必须是单一命令——changesets/action 按空格切分参数（不经 shell），不能写 && 串联命令；故用根脚本 release 封装
        with:
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: true
          push-git-tags: true
