# yaml-language-server: $schema=https://www.schemastore.org/pnpm-workspace.json

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@antfu/eslint-config@9.5.1'
  - eslint-plugin-pnpm@1.9.1
  - pnpm-workspace-yaml@1.9.1
  - '@tsdown/css@0.23.0'
  - rolldown-plugin-dts@0.28.5
  - tinyexec@1.3.1
  - tsdown@0.23.0

trustPolicy: no-downgrade
shellEmulator: true

packages:
  - 'packages/*' # 顶层包（如将来的 tools/* 等直接平层包）
  - 'packages/*/*' # ui/hooks/tools 域下的嵌套包（如 ui/vue、hooks/vue）
  - 'playgrounds/*'
  - 'examples/demo/*'

# pnpm 默认拦截依赖的安装脚本，此处放行：lefthook 需要 postinstall 下载/链接二进制
allowBuilds:
  lefthook: true

# 依赖统一治理：按职责分组为命名 catalog，引用时写 "catalog:<组名>"
catalogs:
  build:
    '@tsdown/css': ^0.23.0
    '@vitejs/plugin-vue': ^6.0.8
    tsdown: ^0.23.0
    typescript: ~6.0.3
    unplugin-vue: ^7.2.0
    vite: ^8.2.2
    vue-tsc: ^3.3.11
  check:
    '@arethetypeswrong/cli': ^0.18.5
    publint: ^0.3.24
  commit:
    '@commitlint/cli': ^21.2.2
    '@commitlint/config-conventional': ^21.2.2
  hooks:
    lefthook: ^2.1.12
  lint:
    '@antfu/eslint-config': ^9.5.1
    cspell: ^10.2.0
    eslint: ^10.9.1
  test:
    vitest: ^4.1.11
  web:
    vue: ^3.5.24
    vue-router: ^5.3.1
  workspace:
    '@changesets/cli': ^3.0.1
    turbo: ^2.10.12
